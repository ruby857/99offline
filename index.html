x.fillStyle="#c6ff2e";x.font="bold 14px sans-serif";x.textAlign="left";x.textBaseline="alphabetic";x.fillText(`Score ${sc}   Best ${S.get("hs_045",0)}`,6,16);

IMPL["037"]=(el,h)=>{let g=Array.from({length:4},()=>Array(4).fill(0)),sc=0,hist=[];const box=document.createElement("div");box.style.cssText="display:inline-grid;grid-template-columns:repeat(4,70px);gap:6px";el.appendChild(box);
