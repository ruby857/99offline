<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>99 OFFLINE</title>
<style>
:root{--bg:#141414;--sf:#222;--sf2:#2c2c2c;--tx:#f2f2f2;--mu:#999;--ac:#c6ff2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid #333;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:20px;margin:0 8px 0 0;letter-spacing:2px}h1 b{color:var(--ac)}
input,button,select{background:var(--sf);color:var(--tx);border:1px solid #444;padding:7px 11px;font:inherit;cursor:pointer}
input{cursor:text;min-width:220px}button:hover,.on{border-color:var(--ac)}button.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
#st{margin-left:auto;font-size:12px;color:var(--mu)}#st i{display:inline-block;width:8px;height:8px;background:var(--mu);margin-right:5px}#st.o i{background:var(--ac)}
main{padding:16px 20px;max-width:1300px;margin:auto}h2{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid #333;padding:0}.card:hover{border-color:var(--ac)}.card svg{display:block;width:100%;height:80px}
.card div{padding:8px 10px}.card small{color:var(--mu)}.card .r{display:flex;gap:6px;margin-top:6px}.card .r button{padding:4px 9px}
.card.x{opacity:.55}
#gv{display:none;padding:16px 20px;max-width:760px;margin:auto}#gv .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}#gv .bar h2{margin:0 auto 0 0;font-size:18px;color:var(--tx);text-transform:none}
.info{background:var(--sf);padding:10px;margin-bottom:10px;color:#ccc}#play{text-align:center}#msg{min-height:24px;margin:8px 0;color:var(--ac)}
canvas{background:#0d0d0d;border:1px solid #444;max-width:100%}
.b{display:inline-grid;gap:4px}.b button{width:64px;height:64px;font-size:26px;padding:0}.b .lit{background:var(--ac);color:#111}
.t{width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;background:var(--sf2)}
</style></head><body>
<header><h1>99<b> OFFLINE</b></h1><input id="q" type="search" placeholder="Search title, ID or keyword" aria-label="Search"><button id="rnd">Random</button><button id="dly" class="p">Daily challenge</button><button id="set">Settings</button><span id="st"><i></i><span></span></span></header>
<main id="home"><div class="chips" id="chips"></div><div id="rec"></div><div id="fav"></div><h2 id="ch">Catalogue</h2><div class="grid" id="cat"></div></main>
<section id="gv"><div class="bar"><h2 id="gt"></h2><span id="best"></span><button id="rs">Restart</button><button id="ex">Exit</button></div><div class="info" id="gi"></div><div id="play"></div><div id="msg" role="status"></div></section>
<script>
"use strict";
const CATS=["Party & Social","Board & Strategy","Card Games","Puzzles","Arcade","Strategy","Quiz & Words","Sports & Physics","Creative"];
const T="Imposter|Who's Most Likely?|Undercover|Spyfall Offline|Charades|Heads Up: Offline Edition|Two Truths and a Lie|Word Association|Categories Blitz|Secret Word|Mafia / Werewolf|Ludo|Snakes and Ladders|Checkers|Chess|Tic-Tac-Toe|Connect Four|Reversi / Othello|Dots and Boxes|Mancala|Battleship|Gomoku|Klondike Solitaire|Spider Solitaire|FreeCell|Pyramid Solitaire|Golf Solitaire|Crazy Eights|War|Memory Match|Old Maid|Go Fish|Blackjack Practice|Sudoku|Nonogram|Minesweeper|2048|Daily Word Puzzle|Anagram Solver Challenge|Word Search|Mini Crossword|KenKen|Mastermind|Lights Out|Snake|Pong|Brick Breaker|Space Defender|Asteroid Dodge|Flappy Square|Mini Platformer|Endless Runner|Falling Blocks|Whack-a-Mole|Reaction Test|Mini Tower Defense|Kingdom Grid|Tactical Duel|Tiny Roguelike|Resource Colony|Hex Conquest|Pocket Artillery|Nim|Chess Tactics|Grid Conquest|Mini Factory|Trivia Arena|Geography Challenge|Math Sprint|Spelling Bee|Typing Speed Test|Hangman|Word Ladder|Anagram Race|Vocabulary Builder|Flag Quiz|Memory Sequence|Penalty Shootout|Basketball Free Throw|Mini Golf|Pocket Bowling|Pocket Pool|Table Tennis|Top-Down Racing|Ski Slalom|Soccer Juggling|Cricket Batting|Target Archery|Pixel Painter|Pixel Art Challenge|Maze Explorer|Draw and Guess|Pocket Music Studio|Drum Pad|Fractal Explorer|Virtual Aquarium|Virtual Pet|Mini City Builder|Platformer Level Editor".split("|");
const GAMES=T.map((t,i)=>({id:String(i+1).padStart(3,"0"),title:t,cat:Math.floor(i/11)}));
const ids=new Set(GAMES.map(g=>g.id));if(ids.size!==99||GAMES.length!==99)console.error("Catalogue ID check failed");
// ---------- storage ----------
const mem={};const S={get(k,d){try{const v=localStorage.getItem("99o_"+k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem("99o_"+k,JSON.stringify(v))}catch(e){}}};
// ---------- games: each fn(el,h) ; h.on(target,ev,fn) auto-cleaned, h.every(fn,ms), h.msg(s), h.score(n,lowerBetter) ----------
const IMPL={};const $=s=>document.querySelector(s);
const info={};
function btnBoard(el,n,cols){const b=document.createElement("div");b.className="b";b.style.gridTemplateColumns=`repeat(${cols},auto)`;const bs=[];for(let i=0;i<n;i++){const x=document.createElement("button");b.appendChild(x);bs.push(x)}el.appendChild(b);return bs}
// 016 Tic-Tac-Toe
info["016"]="You are X, the computer is O (unbeatable minimax). Click a square. Best = wins.";
IMPL["016"]=(el,h)=>{const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let B=Array(9).fill(""),over=false;
const win=b=>{for(const l of L)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return b[l[0]];return b.includes("")?null:"D"};
const mm=(b,p)=>{const w=win(b);if(w)return w==="O"?1:w==="X"?-1:0;let best=p==="O"?-2:2,mv=-1;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p==="O"?"X":"O");b[i]="";if(p==="O"?s>best:s<best)best=s}return best};
const bs=btnBoard(el,9,3);const draw=()=>bs.forEach((x,i)=>x.textContent=B[i]);
const end=()=>{const w=win(B);if(w){over=true;h.msg(w==="D"?"Draw.":w+" wins!");if(w==="X")h.score(1)}return over};
bs.forEach((x,i)=>h.on(x,"click",()=>{if(over||B[i])return;B[i]="X";if(!end()){let bi=-1,bsx=-2;for(let j=0;j<9;j++)if(!B[j]){B[j]="O";const s=mm(B,"X");B[j]="";if(s>bsx){bsx=s;bi=j}}B[bi]="O";end()}draw()}));h.msg("Your move.")};
// 045 Snake
info["045"]="Arrow keys / WASD to steer (swipe on touch). Eat food, avoid walls and yourself. Speed rises with score.";
IMPL["045"]=(el,h)=>{const N=20,Z=18,cv=document.createElement("canvas");cv.width=cv.height=N*Z;el.appendChild(cv);const x=cv.getContext("2d");
let s=[{x:10,y:10}],d={x:1,y:0},nd=d,f,sc=0,dead=false,tm;const pf=()=>{do f={x:Math.random()*N|0,y:Math.random()*N|0};while(s.some(p=>p.x===f.x&&p.y===f.y))};pf();
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
h.on(window,"keydown",e=>{const k=K[e.key];if(k){e.preventDefault();if(k[0]!==-d.x||k[1]!==-d.y)nd={x:k[0],y:k[1]}}});
let t0;h.on(cv,"touchstart",e=>{t0=e.touches[0]},{passive:true});h.on(cv,"touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;nd=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};if(nd.x===-d.x&&nd.y===-d.y)nd=d});
const draw=()=>{x.fillStyle="#0d0d0d";x.fillRect(0,0,cv.width,cv.height);x.fillStyle="#c6ff2e";x.fillRect(f.x*Z+2,f.y*Z+2,Z-4,Z-4);x.fillStyle="#ddd";s.forEach(p=>x.fillRect(p.x*Z+1,p.y*Z+1,Z-2,Z-2))};
const step=()=>{d=nd;const n={x:s[0].x+d.x,y:s[0].y+d.y};if(n.x<0||n.y<0||n.x>=N||n.y>=N||s.some(p=>p.x===n.x&&p.y===n.y)){dead=true;h.msg("Game over. Score "+sc);h.score(sc);return}s.unshift(n);if(n.x===f.x&&n.y===f.y){sc++;pf();h.msg("Score "+sc);clearInterval(tm);tm=h.every(step,Math.max(60,130-sc*3))}else s.pop();draw()};
tm=h.every(step,130);draw();h.msg("Score 0")};
// 037 2048
info["037"]="Arrow keys / WASD or swipe to slide tiles. Equal tiles merge. Reach 2048 (and keep going). U = undo.";
IMPL["037"]=(el,h)=>{let g=Array.from({length:4},()=>Array(4).fill(0)),sc=0,hist=[];const box=document.createElement("div");box.style.cssText="display:inline-grid;grid-template-columns:repeat(4,70px);gap:6px";el.appendChild(box);
const add=()=>{const e=[];g.forEach((r,i)=>r.forEach((v,j)=>v||e.push([i,j])));if(e.length){const[i,j]=e[Math.random()*e.length|0];g[i][j]=Math.random()<.9?2:4}};add();add();
const draw=()=>{box.innerHTML="";g.flat().forEach(v=>{const t=document.createElement("div");t.className="t";t.textContent=v||"";if(v)t.style.background=`hsl(75 ${Math.min(100,30+Math.log2(v)*7)}% ${Math.max(18,70-Math.log2(v)*4)}%)`,t.style.color=v>4?"#111":"#eee";box.appendChild(t)})};
const slide=r=>{let a=r.filter(Boolean),p=0;for(let i=0;i<a.length;i++)if(a[i]===a[i+1]){a[i]*=2;p+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);return[a,p]};
const mv=dir=>{const o=JSON.stringify(g),os=sc;let n=g.map(r=>[...r]);const rot=m=>m[0].map((_,i)=>m.map(r=>r[i]));
if(dir===0)n=n.map(r=>{const[a,p]=slide(r);sc+=p;return a});if(dir===1)n=n.map(r=>{const[a,p]=slide([...r].reverse());sc+=p;return a.reverse()});
if(dir===2)n=rot(rot(n).map(r=>{const[a,p]=slide(r);sc+=p;return a}));if(dir===3)n=rot(rot(n).map(r=>{const[a,p]=slide([...r].reverse());sc+=p;return a.reverse()}));
if(JSON.stringify(n)===o){sc=os;return}hist.push([o,os]);g=n;add();draw();h.msg("Score "+sc);h.score(sc);
const can=g.some((r,i)=>r.some((v,j)=>!v||(g[i][j+1]===v)||(g[i+1]&&g[i+1][j]===v)));if(!can)h.msg("Game over. Score "+sc);if(g.flat().includes(2048))h.msg("2048! You win. Score "+sc)};
const K={ArrowLeft:0,a:0,ArrowRight:1,d:1,ArrowUp:2,w:2,ArrowDown:3,s:3};
h.on(window,"keydown",e=>{if(e.key in K){e.preventDefault();mv(K[e.key])}else if(e.key==="u"&&hist.length){const[o,s]=hist.pop();g=JSON.parse(o);sc=s;draw();h.msg("Score "+sc)}});
let t0;h.on(box,"touchstart",e=>{t0=e.touches[0]},{passive:true});h.on(box,"touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;Math.abs(dx)>Math.abs(dy)?mv(dx<0?0:1):mv(dy<0?2:3)});draw();h.msg("Score 0")};
// 030 Memory Match
info["030"]="Click two cards to find matching pairs. Fewer moves and less time is better (score = moves).";
IMPL["030"]=(el,h)=>{const sy="◆●▲■★♥♣♠".split("");let c=[...sy,...sy].sort(()=>Math.random()-.5),op=[],done=new Set(),mvs=0,t0=Date.now(),lock=false;const bs=btnBoard(el,16,4);
const draw=()=>bs.forEach((b,i)=>{b.textContent=op.includes(i)||done.has(i)?c[i]:"?";b.className=done.has(i)?"lit":""});
bs.forEach((b,i)=>h.on(b,"click",()=>{if(lock||op.includes(i)||done.has(i))return;op.push(i);draw();if(op.length===2){mvs++;const[a,b2]=op;if(c[a]===c[b2]){done.add(a);done.add(b2);op=[];if(done.size===16){h.msg(`Cleared in ${mvs} moves, ${((Date.now()-t0)/1000)|0}s`);h.score(mvs,true)}else h.msg("Moves "+mvs)}else{lock=true;h.msg("Moves "+mvs);h.after(()=>{op=[];lock=false;draw()},700)}draw()}}));draw();h.msg("Moves 0")};
// 055 Reaction Test
info["055"]="Click the box when it turns lime. Clicking early is a false start. Score = best average (ms).";
IMPL["055"]=(el,h)=>{const b=document.createElement("button");b.style.cssText="width:320px;height:200px;font-size:20px";el.appendChild(b);let st="idle",t0,to,res=[];
const arm=()=>{st="wait";b.textContent="Wait for lime…";b.style.background="#333";b.style.color="#fff";to=h.after(()=>{st="go";t0=performance.now();b.style.background="#c6ff2e";b.style.color="#111";b.textContent="CLICK!"},1000+Math.random()*3000)};
h.on(b,"click",()=>{if(st==="idle"){arm()}else if(st==="wait"){clearTimeout(to);h.msg("Too early!");b.textContent="Too early. Click to retry";st="idle"}else if(st==="go"){const r=Math.round(performance.now()-t0);res.push(r);const av=Math.round(res.reduce((a,c)=>a+c)/res.length);h.msg(`${r} ms (avg ${av} ms, ${res.length} tries)`);h.score(av,true);b.textContent="Click to go again";b.style.background="#333";b.style.color="#fff";st="idle"}});b.textContent="Click to start";h.msg("")};
// 044 Lights Out
info["044"]="Click a cell to toggle it and its neighbours. Turn every light off. U = undo. Puzzles are always solvable.";
IMPL["044"]=(el,h)=>{let g=Array(25).fill(0),mvs=0,hist=[];const bs=btnBoard(el,25,5);const tg=i=>{const r=i/5|0,c=i%5;[[r,c],[r+1,c],[r-1,c],[r,c+1],[r,c-1]].forEach(([y,x])=>{if(y>=0&&y<5&&x>=0&&x<5)g[y*5+x]^=1})};
for(let k=0;k<12;k++)tg(Math.random()*25|0);if(!g.some(Boolean))tg(12);
const draw=()=>bs.forEach((b,i)=>{b.className=g[i]?"lit":"";b.textContent=""});
bs.forEach((b,i)=>h.on(b,"click",()=>{if(!g.some(Boolean))return;hist.push([...g]);tg(i);mvs++;draw();if(!g.some(Boolean)){h.msg("Solved in "+mvs+" moves!");h.score(mvs,true)}else h.msg("Moves "+mvs)}));
h.on(window,"keydown",e=>{if(e.key==="u"&&hist.length){g=hist.pop();mvs--;draw();h.msg("Moves "+mvs)}});draw();h.msg("Moves 0")};
// 063 Nim
info["063"]="Take any number of objects from ONE pile per turn. Whoever takes the last object wins. The computer uses nim-sum (XOR) strategy.";
IMPL["063"]=(el,h)=>{let p=[3,4,5],over=false;const box=document.createElement("div");el.appendChild(box);
const ai=()=>{const x=p.reduce((a,c)=>a^c,0);if(x){for(let i=0;i<3;i++){const t=p[i]^x;if(t<p[i]){p[i]=t;return}}}const i=p.findIndex(v=>v>0);p[i]--};
const draw=()=>{box.innerHTML="";p.forEach((n,i)=>{const r=document.createElement("div");r.style.margin="8px";for(let k=1;k<=n;k++){const b=document.createElement("button");b.textContent="●";b.title=`Take ${n-k+1} from pile ${i+1}`;h.on(b,"click",()=>{if(over)return;p[i]=k-1;if(!p.some(Boolean)){over=true;h.msg("You took the last object. You win!");h.score(1);draw();return}ai();draw();if(!p.some(Boolean)){over=true;h.msg("Computer wins.")}});r.appendChild(b)}box.appendChild(r)})};draw();h.msg("Click an object to take it and all to its right.")};
// 043 Mastermind
info["043"]="Crack the hidden 4-colour code in 10 guesses. Click colours to fill slots, then Submit. ● = right colour and place, ○ = right colour, wrong place. Colours are numbered 1-6 left to right.";
IMPL["043"]=(el,h)=>{const C=["#e33","#3a3","#36e","#ec3","#c6c","#3cc"],code=Array.from({length:4},()=>Math.random()*6|0);let g=[],n=0,over=false;
const cur=document.createElement("div"),pal=document.createElement("div"),hs=document.createElement("div");cur.style.margin=pal.style.margin="8px";
const dot=c=>`<span style="display:inline-block;width:22px;height:22px;margin:2px;background:${c}"></span>`;
const draw=()=>{cur.innerHTML=[0,1,2,3].map(i=>dot(g[i]!=null?C[g[i]]:"#333")).join("")};
C.forEach((c,i)=>{const b=document.createElement("button");b.style.cssText="width:36px;height:36px;background:"+c;b.setAttribute("aria-label","colour "+(i+1));h.on(b,"click",()=>{if(!over&&g.length<4){g.push(i);draw()}});pal.appendChild(b)});
const sb=document.createElement("button"),cb=document.createElement("button");sb.textContent="Submit";sb.className="p";cb.textContent="Clear";
h.on(cb,"click",()=>{g=[];draw()});
h.on(sb,"click",()=>{if(over||g.length<4)return;let bl=0,wh=0,cc=[...code],gg=[...g];for(let i=0;i<4;i++)if(gg[i]===cc[i]){bl++;cc[i]=gg[i]=-1}
for(let i=0;i<4;i++)if(gg[i]>=0){const j=cc.indexOf(gg[i]);if(j>=0){wh++;cc[j]=-1}}
n++;hs.insertAdjacentHTML("afterbegin",`<div>${g.map(x=>dot(C[x])).join("")} ● ${bl} ○ ${wh}</div>`);
if(bl===4){over=true;h.msg("Cracked in "+n+" guesses!");h.score(n,true)}else if(n>=10){over=true;h.msg("Out of guesses. Code was "+code.map(x=>x+1).join(" "))}else h.msg("Guess "+(n+1)+" of 10");g=[];draw()});
el.append(cur,pal,sb,cb,hs);draw();h.msg("Guess 1 of 10")};
// 054 Whack-a-Mole
info["054"]="Click the lime mole when it appears. 30 seconds. Misses subtract from your score. Moles get faster.";
IMPL["054"]=(el,h)=>{const bs=btnBoard(el,9,3);let sc=0,miss=0,t=30,m=-1;const draw=()=>bs.forEach((b,i)=>{b.className=i===m?"lit":"";b.textContent=i===m?"●":""});
const upd=()=>h.msg(`Score ${sc} · Misses ${miss} · ${t}s`);
bs.forEach((b,i)=>h.on(b,"click",()=>{if(t<=0)return;if(i===m){sc++;m=-1}else miss++;draw();upd()}));
h.every(()=>{if(t<=0)return;t--;if(t<=0){m=-1;draw();const f=Math.max(0,sc-miss);h.msg(`Time! Final ${f} (hits ${sc}, misses ${miss})`);h.score(f)}else upd()},1000);
const mv=()=>{if(t<=0)return;m=Math.random()*9|0;draw();h.after(mv,Math.max(350,800-(30-t)*15))};mv();upd()};
// 072 Hangman
info["072"]="Guess the word letter by letter (click or type). A clue is shown. 6 wrong guesses and you lose.";
IMPL["072"]=(el,h)=>{const L=[["PLANET","Orbits a star"],["GUITAR","Six-string instrument"],["BRIDGE","Crosses a river"],["JUNGLE","Dense tropical forest"],["KEYBOARD","You type on it"],["ROCKET","Launched into space"],["CANDLE","Wax and a wick"],["ISLAND","Land surrounded by water"]],[w,cl]=L[Math.random()*L.length|0];
let used=new Set(),bad=0,over=false;const bd={},wd=document.createElement("div"),kb=document.createElement("div");wd.style.cssText="font:700 32px monospace;letter-spacing:6px;margin:10px";
const draw=()=>{wd.textContent=[...w].map(c=>used.has(c)?c:"_").join(" ");h.msg(`Clue: ${cl} · Wrong ${bad}/6`)};
const guess=c=>{if(over||used.has(c))return;used.add(c);bd[c].disabled=true;if(!w.includes(c))bad++;draw();
if([...w].every(x=>used.has(x))){over=true;h.msg("You win! "+w);h.score(6-bad)}else if(bad>=6){over=true;wd.textContent=[...w].join(" ");h.msg("You lose. Word: "+w)}};
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(c=>{const b=document.createElement("button");b.textContent=c;b.style.cssText="width:34px;margin:2px";h.on(b,"click",()=>guess(c));bd[c]=b;kb.appendChild(b)});
h.on(window,"keydown",e=>{const c=e.key.toUpperCase();if(/^[A-Z]$/.test(c)&&bd[c])guess(c)});el.append(wd,kb);draw()};
// 069 Math Sprint
info["069"]="Solve as many arithmetic questions as you can in 30 seconds. Type the answer and press Enter. Questions get harder as your streak grows.";
IMPL["069"]=(el,h)=>{let sc=0,st=0,t=30,ans;const q=document.createElement("div"),i=document.createElement("input");q.style.cssText="font:700 34px monospace;margin:10px";i.type="number";i.setAttribute("aria-label","answer");
const upd=()=>h.msg(`Score ${sc} · Streak ${st} · ${t}s`);
const nq=()=>{const a=2+(Math.random()*(10+st*2)|0),b=2+(Math.random()*10|0),o=Math.random()*3|0;if(o===0){ans=a+b;q.textContent=a+" + "+b}else if(o===1){ans=a;q.textContent=(a+b)+" − "+b}else{const x=2+(Math.random()*11|0);ans=x*b;q.textContent=x+" × "+b}};
h.on(i,"keydown",e=>{if(e.key==="Enter"&&t>0&&i.value!==""){if(+i.value===ans){sc++;st++}else st=0;i.value="";nq();upd()}});
h.every(()=>{if(t<=0)return;t--;if(t<=0){i.disabled=true;h.msg("Time! Score "+sc);h.score(sc)}else upd()},1000);
el.append(q,i);nq();upd();i.focus()};
// ---- shared pass-and-play lobby ----
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lobby(el,h,min,max,opt,go){let n=Math.max(min,Math.min(max,5)),k=1;const names=[];
const show=()=>{k=Math.min(k,Math.max(1,(n-1)>>1));let o=`<h3>Players ${n} <button data-l="pm">−</button><button data-l="pp">+</button>`+(opt?` · ${opt===true?"Imposters":opt} ${k} <button data-l="km">−</button><button data-l="kp">+</button>`:"")+`</h3>`;
for(let j=0;j<n;j++)o+=`<div><input data-n="${j}" value="${esc(names[j]||"Player "+(j+1))}" aria-label="Player ${j+1} name"></div>`;el.innerHTML=o+`<p><button class="p" data-l="go">Start</button></p>`;h.msg("")};
h.on(el,"input",e=>{if(e.target.dataset.n!=null)names[e.target.dataset.n]=e.target.value});
h.on(el,"click",e=>{const a=e.target.dataset&&e.target.dataset.l;if(!a)return;if(a==="pm"&&n>min)n--;if(a==="pp"&&n<max)n++;if(a==="km"&&k>1)k--;if(a==="kp")k++;
if(a==="go"){go(Array.from({length:n},(_,j)=>(names[j]||"").trim()||"Player "+(j+1)),Math.min(k,Math.max(1,(n-1)>>1)));return}show()});return{show}}
// 001 Imposter
info["001"]="3–12 players share one device. Crew see the same secret word; imposters see none. Everyone views their role privately, gives one clue each, then votes (privately). Highest vote is eliminated (ties: nobody). Crew win when all imposters are out; imposters win when they equal the crew.";
IMPL["001"]=(el,h)=>{const WD="Pizza,Volcano,Library,Bicycle,Piano,Rainbow,Castle,Submarine,Basketball,Telescope,Pyramid,Lighthouse,Backpack,Campfire,Skateboard,Museum,Compass,Umbrella,Glacier,Orchestra".split(",");
let P=[],word,st="setup",i=0,shown=false,A=[],vi=0,vshown=false,tally,rt="",over=false,starter="";
const imp=()=>P.filter(p=>p.alive&&p.imp).length,crew=()=>P.filter(p=>p.alive&&!p.imp).length;
const pick=()=>{const a=P.filter(p=>p.alive);starter=a[Math.random()*a.length|0].name};
const L=lobby(el,h,3,12,true,(nm,k)=>{P=nm.map(name=>({name,imp:false,alive:true}));[...P.keys()].sort(()=>Math.random()-.5).slice(0,k).forEach(j=>P[j].imp=true);word=WD[Math.random()*WD.length|0];st="pass";i=0;shown=false;over=false;draw()});
const draw=()=>{let o="";const pl=P[i];
if(st==="pass")o=shown?`<h2>${esc(pl.name)}</h2>`+(pl.imp?`<p style="font-size:24px;color:#c6ff2e">You are the IMPOSTER</p><p>You do not know the word. Blend in.</p>`:`<p>The secret word is</p><p style="font-size:34px;color:#c6ff2e">${esc(word)}</p>`)+`<button class="p" data-a="hide">Hide and pass on</button>`:`<h2>Pass the device to ${esc(pl.name)}</h2><button class="p" data-a="show">I am ${esc(pl.name)}: show my role</button>`;
if(st==="discuss")o=`<h2>Discussion</h2><p>Alive: ${P.filter(p=>p.alive).map(p=>esc(p.name)).join(", ")}</p><p>Imposters left: ${imp()} · Crew: ${crew()}</p><p>${esc(starter)} starts. Each player gives one clue about the word.</p><button class="p" data-a="vote">Start voting</button>`;
if(st==="vote"){const v=A[vi];o=vshown?`<h2>${esc(v.name)}: who is the imposter?</h2>`+A.filter(p=>p!==v).map(p=>`<button data-a="cast" data-t="${P.indexOf(p)}">${esc(p.name)}</button>`).join(" "):`<h2>Pass the device to ${esc(v.name)}</h2><button class="p" data-a="ready">Ready to vote privately</button>`}
if(st==="result")o=`<h2>${esc(rt)}</h2>`+(over?`<p>The word was <b>${esc(word)}</b>. Imposters: ${P.filter(p=>p.imp).map(p=>esc(p.name)).join(", ")}</p><button class="p" data-a="again">Play again</button>`:`<button class="p" data-a="next">Next round</button>`);
el.innerHTML=o};
const resolve=()=>{const mx=Math.max(...tally.values()),top=[...tally].filter(([,c])=>c===mx);
if(top.length>1)rt=`Tie at ${mx} vote(s): nobody is eliminated.`;else{const p=P[top[0][0]];p.alive=false;rt=`${p.name} was eliminated with ${mx} votes and was ${p.imp?"an IMPOSTER":"crew"}.`}
if(imp()===0){over=true;rt+=" Crew win!"}else if(imp()>=crew()){over=true;rt+=" Imposters win!"}st="result"};
h.on(el,"click",e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
if(a==="show")shown=true;else if(a==="hide"){shown=false;i++;if(i>=P.length){st="discuss";pick()}}
else if(a==="vote"){st="vote";A=P.filter(p=>p.alive);vi=0;vshown=false;tally=new Map()}
else if(a==="ready")vshown=true;
else if(a==="cast"){const t=+e.target.dataset.t;tally.set(t,(tally.get(t)||0)+1);vi++;vshown=false;if(vi>=A.length)resolve()}
else if(a==="next"){st="discuss";pick()}else if(a==="again"){st="setup";L.show();return}
draw()});L.show()};
// 002 Who's Most Likely?
info["002"]="3–12 players. A prompt appears; each player privately votes for a named player. Votes are revealed together and the most-voted player(s) score a point. 8 prompts per game.";
IMPL["002"]=(el,h)=>{const Q=["Most likely to invent something famous?","Most likely to win a baking contest?","Most likely to be late to their own party?","Most likely to read a whole book in one day?","Most likely to adopt too many pets?","Most likely to get lost holding a map?","Most likely to ace a surprise quiz?","Most likely to tell the best joke?","Most likely to start a school club?","Most likely to sleep through an alarm?","Most likely to become a teacher?","Most likely to organise everyone's schedule?"];
let P=[],sc=[],qs=[],qi=0,vi=0,vs=[],shown=false,rev=false,L;
L=lobby(el,h,3,12,false,nm=>{P=nm;sc=P.map(()=>0);qs=[...Q].sort(()=>Math.random()-.5).slice(0,8);qi=0;vi=0;vs=[];shown=false;rev=false;draw()});
const draw=()=>{let o="";if(qi>=qs.length){const m=Math.max(...sc);o=`<h2>Final scores</h2>`+P.map((p,j)=>`<div>${esc(p)}: ${sc[j]}${sc[j]===m?" ★":""}</div>`).join("")+`<p><button class="p" data-a="again">Play again</button></p>`}
else if(rev){const c=P.map((_,j)=>vs.filter(x=>x===j).length);o=`<h3>${esc(qs[qi])}</h3>`+P.map((p,j)=>`<div>${esc(p)}: ${c[j]} vote(s)</div>`).join("")+`<p><button class="p" data-a="next">${qi+1<qs.length?"Next prompt":"See final scores"}</button></p>`}
else o=`<h3>Round ${qi+1}/${qs.length}: ${esc(qs[qi])}</h3>`+(shown?`<p>${esc(P[vi])}, vote privately:</p>`+P.map((p,j)=>j===vi?"":`<button data-a="cast" data-t="${j}">${esc(p)}</button>`).join(" "):`<p>Pass the device to ${esc(P[vi])}</p><button class="p" data-a="ready">Ready</button>`);el.innerHTML=o};
h.on(el,"click",e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
if(a==="ready")shown=true;else if(a==="cast"){vs.push(+e.target.dataset.t);vi++;shown=false;if(vi>=P.length){rev=true;const c=P.map((_,j)=>vs.filter(x=>x===j).length),m=Math.max(...c);c.forEach((x,j)=>{if(x===m)sc[j]++})}}
else if(a==="next"){qi++;vi=0;vs=[];rev=false;shown=false}else if(a==="again"){L.show();return}draw()});L.show()};
// ---- shared helpers: private role reveal, private vote, word-turn engine ----
function reveal(el,h,N,fn,done){let i=0,sh=0,on=1;const d=()=>{el.innerHTML=sh?`<h2>${esc(N[i])}</h2>${fn(i)}<p><button class="p" data-r="n">Hide and pass on</button></p>`:`<h2>Pass the device to ${esc(N[i])}</h2><button class="p" data-r="s">I am ${esc(N[i])}: show</button>`};
h.on(el,"click",e=>{const a=e.target.dataset&&e.target.dataset.r;if(!on||!a)return;if(a==="s")sh=1;else{sh=0;if(++i>=N.length){on=0;done();return}}d()});d()}
function vote(el,h,N,A,t,done){let k=0,sh=0,on=1,vs=[];const d=()=>{const v=A[k];el.innerHTML=sh?`<h2>${esc(N[v])}: ${t}</h2>`+A.filter(j=>j!==v).map(j=>`<button data-v="${j}">${esc(N[j])}</button>`).join(" "):`<h2>Pass the device to ${esc(N[v])}</h2><button class="p" data-v="r">Ready to vote privately</button>`};
h.on(el,"click",e=>{const a=e.target.dataset&&e.target.dataset.v;if(!on||a==null)return;if(a==="r")sh=1;else{vs.push(+a);sh=0;if(++k>=A.length){on=0;done(vs);return}}d()});d()}
const top1=vs=>{const c={};vs.forEach(x=>c[x]=(c[x]||0)+1);const m=Math.max(...Object.values(c)),t=Object.keys(c).filter(k=>c[k]===m);return{m,t:t.length===1?+t[0]:-1}};
const big=s=>`<p style="font-size:34px;color:#c6ff2e">${esc(s)}</p>`;
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function wg(el,h,W,T,rounds,secs,done){let sc=T.map(()=>0),n=0,ws=[],w="",t=0,run=0,cat;const C=Object.keys(W),tot=T.length*rounds,cur=()=>n%T.length;
const nw=()=>{if(!ws.length)ws=shuf(W[cat]);w=ws.pop()};
const pick=()=>{el.innerHTML=`<h2>${esc(T[cur()])}: turn ${n+1}/${tot}</h2><p>Scores: ${T.map((x,j)=>esc(x)+" "+sc[j]).join(" · ")}</p><p>Choose a category, then start:</p>`+C.map(c=>`<button data-c="${c}">${c}</button>`).join(" ")};
const draw=()=>{el.innerHTML=`<h2><span id="wt">${t}</span>s</h2>${big(w)}<p>${esc(T[cur()])} score: ${sc[cur()]}</p><button class="p" data-w="c">Correct</button> <button data-w="s">Skip</button>`};
h.every(()=>{if(!run)return;if(--t<=0){run=0;n++;if(n>=tot){el.innerHTML=`<h2>Final scores</h2>`+T.map((x,j)=>`<div>${esc(x)}: ${sc[j]}</div>`).join("")+`<p><button class="p" data-w="a">Play again</button></p>`;done(Math.max(...sc))}else pick()}else{const x=el.querySelector("#wt");if(x)x.textContent=t}},1000);
h.on(el,"click",e=>{const d=e.target.dataset;if(!d)return;if(d.c){cat=d.c;ws=[];nw();t=secs;run=1;draw()}else if(d.w==="c"&&run){sc[cur()]++;nw();draw()}else if(d.w==="s"&&run){nw();draw()}else if(d.w==="a"){sc=T.map(()=>0);n=0;pick()}});pick()}
// 003 Undercover
info["003"]="3–12 players. Civilians share one secret word; undercover players get a similar but different word. Everyone views their word privately, gives one clue, then votes. Civilians win by removing all undercover players; undercover win when they equal the civilians.";
IMPL["003"]=(el,h)=>{const WP=[["Coffee","Tea"],["Cat","Dog"],["Guitar","Violin"],["River","Lake"],["Bus","Train"],["Pencil","Pen"],["Pizza","Burger"],["Moon","Sun"]];
let N,U,w,al,L;const win=()=>{const u=al.filter(j=>U[j]).length,c=al.length-u;return u===0?"Civilians win!":u>=c?"Undercover win!":""};
const round=()=>{el.innerHTML=`<h2>Discussion</h2><p>Alive: ${al.map(j=>esc(N[j])).join(", ")}</p><p>Each player gives one clue without saying their word.</p><button class="p" data-a="v">Start voting</button>`};
L=lobby(el,h,3,12,"Undercover",(nm,k)=>{N=nm;const p=shuf(WP)[0];w=Math.random()<.5?[p[1],p[0]]:p;U=N.map(()=>false);shuf([...N.keys()]).slice(0,k).forEach(j=>U[j]=true);al=[...N.keys()];reveal(el,h,N,i=>`<p>Your word:</p>${big(U[i]?w[1]:w[0])}`,round)});
h.on(el,"click",e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==="v")vote(el,h,N,al,"who is undercover?",vs=>{const r=top1(vs);let t=r.t<0?`Tie at ${r.m}: nobody is out.`:`${N[r.t]} is out and was ${U[r.t]?"UNDERCOVER":"a civilian"}.`;if(r.t>=0)al=al.filter(j=>j!==r.t);const x=win();
el.innerHTML=`<h2>${esc(t)} ${x}</h2>`+(x?`<p>Civilian word "${esc(w[0])}", undercover word "${esc(w[1])}". Undercover: ${N.filter((_,j)=>U[j]).map(esc).join(", ")}</p><button class="p" data-a="g">Play again</button>`:`<button class="p" data-a="n">Next round</button>`)});
else if(a==="n")round();else if(a==="g")L.show()});L.show()};
// 004 Spyfall Offline
info["004"]="3–12 players. Everyone except the spy sees the secret location and a role. Ask each other questions without naming the place. Call a vote any time (or when 8:00 runs out). If the spy is caught they get one chance to guess the location; if the wrong player is accused the spy wins. The spy may also guess the location early: right = spy wins, wrong = players win.";
IMPL["004"]=(el,h)=>{const LC={Airport:["Pilot","Cabin crew","Passenger","Security officer","Baggage handler"],School:["Teacher","Student","Principal","Janitor","Librarian"],Hospital:["Doctor","Nurse","Patient","Surgeon","Visitor"],Restaurant:["Chef","Waiter","Customer","Manager","Critic"],Beach:["Lifeguard","Surfer","Tourist","Ice-cream seller","Photographer"],Library:["Librarian","Reader","Student","Author","Volunteer"],"Space station":["Commander","Engineer","Scientist","Pilot","Tourist"],Cinema:["Usher","Projectionist","Moviegoer","Manager","Critic"]},NM=Object.keys(LC);
let N,sp,loc,t=480,run=0,L,gm="";
const play=()=>{run=1;el.innerHTML=`<h2>Time left <span id="sf"></span></h2><p>Ask each other questions about the location. Never name it outright!</p><button data-a="g">Spy: guess the location</button> <button class="p" data-a="v">Call vote</button>`;tm()};
const tm=()=>{const x=el.querySelector("#sf");if(x)x.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
const end=m=>{run=0;el.innerHTML=`<h2>${esc(m)}</h2><p>Location: ${esc(loc)}. Spy: ${esc(N[sp])}.</p><button class="p" data-a="a">Play again</button>`};
const guess=m=>{run=0;el.innerHTML=`<h2>${esc(m)}</h2>`+NM.map(n=>`<button data-g="${n}">${n}</button>`).join(" ")};
const dv=()=>{run=0;vote(el,h,N,[...N.keys()],"who is the spy?",vs=>{const r=top1(vs);if(r.t===sp)guess(`${N[sp]} was the spy and is caught! Final guess:`);else end(`The wrong player (or a tie) was accused. Spy wins!`)})};
h.every(()=>{if(run){if(--t<=0)dv();else tm()}},1000);
L=lobby(el,h,3,12,false,nm=>{N=nm;sp=Math.random()*N.length|0;loc=NM[Math.random()*NM.length|0];const R=shuf(LC[loc]);t=480;reveal(el,h,N,i=>i===sp?`<p>You are the SPY.</p><p>Work out the location.</p>`:`<p>Location:</p>${big(loc)}<p>Your role: <b>${esc(R[i%R.length])}</b></p>`,play)});
h.on(el,"click",e=>{const d=e.target.dataset;if(!d)return;if(d.a==="g")guess("The spy makes a guess:");else if(d.a==="v")dv();else if(d.a==="a")L.show();else if(d.g)end(d.g===loc?"Correct guess. Spy wins!":"Wrong guess. Players win!")});L.show()};

// 007 Two Truths and a Lie
info["007"]="3–8 players. In turn, a player privately writes three statements and marks one as the lie. Everyone else votes privately for the lie. Guessers score 1 per correct guess; the author scores 1 per person fooled.";
IMPL["007"]=(el,h)=>{let N,a,sc,S,lie,vs,k,voters,L;
const intro=()=>{el.innerHTML=`<h2>Pass the device to ${esc(N[a])}</h2><p>Everyone else look away.</p><button class="p" data-t="e">Enter my statements</button>`};
const ask=sh=>{const v=voters[k];el.innerHTML=sh?`<h2>${esc(N[v])}: which is the lie?</h2>`+S.map((s,i)=>`<p><button data-t="p" data-i="${i}">${esc(s)}</button></p>`).join(""):`<h2>Pass the device to ${esc(N[v])}</h2><button class="p" data-t="r">Ready</button>`};
L=lobby(el,h,3,8,false,nm=>{N=nm;sc=N.map(()=>0);a=0;intro()});
h.on(el,"click",e=>{const d=e.target.dataset;if(!d||!d.t)return;
if(d.t==="e")el.innerHTML=`<h2>${esc(N[a])}: write 3 statements, mark the lie</h2>`+[0,1,2].map(i=>`<div><input id="s${i}" style="width:70%" aria-label="statement ${i+1}"> <label><input type="radio" name="lie" value="${i}"> lie</label></div>`).join("")+`<p><button class="p" data-t="s">Submit</button></p>`;
else if(d.t==="s"){const v=[0,1,2].map(i=>el.querySelector("#s"+i).value.trim()),r=el.querySelector("input[name=lie]:checked");if(v.some(x=>!x)||!r){h.msg("Fill in all three and mark one lie.");return}h.msg("");const o=shuf([0,1,2]);S=o.map(i=>v[i]);lie=o.indexOf(+r.value);voters=[...N.keys()].filter(j=>j!==a);vs=[];k=0;ask(0)}
else if(d.t==="r")ask(1);
else if(d.t==="p"){vs.push(+d.i);if(++k>=voters.length){const ok=vs.filter(x=>x===lie).length;voters.forEach((v,j)=>{if(vs[j]===lie)sc[v]++});sc[a]+=voters.length-ok;el.innerHTML=`<h2>The lie was: ${esc(S[lie])}</h2><p>${ok} of ${voters.length} spotted it.</p><button class="p" data-t="n">${a+1<N.length?"Next player":"Final scores"}</button>`}else ask(0)}
else if(d.t==="n"){if(++a<N.length)intro();else el.innerHTML=`<h2>Final scores</h2>`+N.map((x,j)=>`<div>${esc(x)}: ${sc[j]}</div>`).join("")+`<p><button class="p" data-t="a">Play again</button></p>`}
else if(d.t==="a")L.show()});L.show()};
// 008 Word Association
info["008"]="2–8 players take turns typing a word related to the previous one within 10 seconds. You are eliminated for an empty or repeated word or running out of time. Anyone can press 'Not related' to eliminate the previous player (agree as a group). Last player standing wins; score = chain length.";
IMPL["008"]=(el,h)=>{const SW=["Ocean","Music","Forest","Rocket","Kitchen","Garden","Storm","Winter"];let N,al,ci,ch,t,pv,run=0,L;
const cur=()=>al[ci],nx=j=>al[(al.indexOf(j)+1)%al.length];
const draw=()=>{el.innerHTML=`<h2>${esc(N[cur()])}'s turn · <span id="wt">${t}</span>s</h2><p>Previous word: <b>${esc(ch[ch.length-1])}</b></p><input id="w" autocomplete="off" aria-label="related word"> <button class="p" data-a="s">Submit</button> <button data-a="x">Not related: eliminate previous player</button><p>Chain: ${esc(ch.join(" → "))}</p>`;el.querySelector("#w").focus()};
const out=(j,why,n)=>{al=al.filter(x=>x!==j);run=0;if(al.length===1){el.innerHTML=`<h2>${esc(N[al[0]])} wins!</h2><p>${esc(N[j])} is out: ${esc(why)}. Chain length ${ch.length}.</p><button class="p" data-a="g">Play again</button>`;h.score(ch.length);return}ci=al.indexOf(n);t=10;pv=-1;run=1;h.msg(`${N[j]} is out: ${why}`);draw()};
const sub=()=>{const i=el.querySelector("#w");if(!i||!run)return;const v=i.value.trim().toLowerCase();if(!v||ch.some(x=>x.toLowerCase()===v))return out(cur(),"empty or repeated word",nx(cur()));ch.push(v);pv=cur();ci=(ci+1)%al.length;t=10;draw()};
h.every(()=>{if(!run)return;if(--t<=0)out(cur(),"ran out of time",nx(cur()));else{const x=el.querySelector("#wt");if(x)x.textContent=t}},1000);
h.on(el,"keydown",e=>{if(e.key==="Enter"&&e.target.id==="w")sub()});
L=lobby(el,h,2,8,false,nm=>{N=nm;al=[...N.keys()];ci=0;ch=[SW[Math.random()*SW.length|0]];t=10;pv=-1;run=1;h.msg("");draw()});
h.on(el,"click",e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==="s")sub();else if(a==="x"&&run&&pv>=0&&al.includes(pv))out(pv,"word judged unrelated",cur());else if(a==="g"){run=0;L.show()}});L.show()};

IMPL["009"]=(el,h)=>{const CT=["Animal","Country","Food","Colour","Job","Sport","City","Fruit or vegetable","Object in a house","Hobby"],LT="ABCDEFGHIJKLMNOPRSTW";let N,sc,r,p,A,cats,lt,t,run=0,L;

const init=()=>{b=Array.from({length:N},()=>Array(N).fill(0));t=1;over=0;last=null;h.msg("Lime to move")};
const place=(r,c)=>{b[r][c]=t;last=[r,c];if(wins(r,c,t)){over=1;h.msg((t===1?"Lime":"White")+" wins!");if(t===1&&mode===1)h.score(1)}else if(b.flat().every(x=>x)){over=1;h.msg("Draw.")}else{t=3-t;h.msg((t===1?"Lime":"White")+" to move")}draw();if(!over&&mode===1&&t===2)h.after(ai,300)};
const ai=()=>{let best=[],bs=-1;if(!b.flat().some(x=>x)){return place(7,7)}for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(b[r][c])continue;let near=false;for(let x=r-2;x<=r+2&&!near;x++)for(let y=c-2;y<=c+2;y++)if(IN(x,y)&&b[x][y]){near=true;break}if(!near)continue;const s=line(r,c,2)+line(r,c,1)*.95;if(s>bs){bs=s;best=[[r,c]]}else if(s===bs)best.push([r,c])}const m=best[Math.random()*best.length|0]||[7,7];place(m[0],m[1])};
const draw=()=>{let o=mb(mode)+`<div style="display:inline-grid;grid-template-columns:repeat(15,32px);gap:1px">`;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=b[r][c],L=last&&last[0]===r&&last[1]===c;o+=`<button data-r="${r}" data-c="${c}" style="width:32px;height:32px;padding:0;font-size:20px;background:${L?"#3d4a14":"#2a2a2a"};color:${v===1?"#c6ff2e":"#eee"}">${v?"●":""}</button>`}el.innerHTML=o+"</div>"};
h.on(el,"click",e=>{const B=e.target.closest("button");if(!B)return;const D=B.dataset;if(D.a){mode=D.a==="m1"?1:2;init();draw();return}if(over||(mode===1&&t===2))return;const r=+D.r,c=+D.c;if(!b[r][c])place(r,c)});init();draw()};
// ---------- shell ----------
let cleanups=[],cur=null,favs=S.get("fav",[]),rec=S.get("rec",[]);
const h={on(t,e,f,o){t.addEventListener(e,f,o);cleanups.push(()=>t.removeEventListener(e,f,o))},every(f,ms){const i=setInterval(f,ms);cleanups.push(()=>clearInterval(i));return i},after(f,ms){const i=setTimeout(f,ms);cleanups.push(()=>clearTimeout(i));return i},msg(s){$("#msg").textContent=s},
score(n,low){const k="hs_"+cur,b=S.get(k,null);if(b===null||(low?n<b:n>b)){S.set(k,n)}showBest()}};
const showBest=()=>{const b=S.get("hs_"+cur,null);$("#best").textContent=b===null?"":"Best: "+b};
function launch(id){const g=GAMES.find(x=>x.id===id);if(!IMPL[id])return;exit(true);cur=id;rec=[id,...rec.filter(x=>x!==id)].slice(0,8);S.set("rec",rec);
$("#home").style.display="none";$("#gv").style.display="block";$("#gt").textContent=id+" · "+g.title;$("#gi").textContent=info[id];showBest();start()}
function start(){cleanups.forEach(f=>f());cleanups=[];const p=$("#play");p.innerHTML="";h.msg("");IMPL[cur](p,h)}
function exit(quiet){cleanups.forEach(f=>f());cleanups=[];$("#play").innerHTML="";cur=null;$("#gv").style.display="none";$("#home").style.display="block";if(!quiet)render()}
$("#rs").onclick=start;$("#ex").onclick=()=>exit();
let cat=-1,showFav=false;
function thumb(id){let s=+id*2654435761%4294967296,r=()=>(s=(s*1103515245+12345)%2147483648)/2147483648,o="";for(let i=0;i<9;i++)o+=`<rect x="${r()*170|0}" y="${r()*60|0}" width="${10+r()*40|0}" height="${6+r()*20|0}" fill="${r()<.25?"#c6ff2e":"#555"}"/>`;return`<svg viewBox="0 0 200 80" aria-hidden="true"><rect width="200" height="80" fill="#1a1a1a"/>${o}</svg>`}
function card(g){const d=document.createElement("div"),ok=!!IMPL[g.id];d.className="card"+(ok?"":" x");d.innerHTML=thumb(g.id)+`<div><small>${g.id} · ${CATS[g.cat]}</small><br><b></b><div class="r"></div></div>`;d.querySelector("b").textContent=g.title;const r=d.querySelector(".r");
const p=document.createElement("button");p.textContent=ok?"Play":"Not built yet";p.className=ok?"p":"";p.disabled=!ok;p.onclick=()=>launch(g.id);const f=document.createElement("button");f.textContent=favs.includes(g.id)?"★":"☆";f.setAttribute("aria-label","Favourite");f.onclick=()=>{favs=favs.includes(g.id)?favs.filter(x=>x!==g.id):[...favs,g.id];S.set("fav",favs);render()};r.append(p,f);return d}
function render(){const q=$("#q").value.trim().toLowerCase();const list=GAMES.filter(g=>(cat<0||g.cat===cat)&&(!showFav||favs.includes(g.id))&&(!q||g.id.includes(q)||g.title.toLowerCase().includes(q)||CATS[g.cat].toLowerCase().includes(q)));
const c=$("#cat");c.innerHTML="";list.forEach(g=>c.appendChild(card(g)));$("#ch").textContent=`Catalogue — ${list.length} shown · ${Object.keys(IMPL).length} of 99 playable`;
const mk=(el,t,ids)=>{el.innerHTML="";if(!ids.length)return;const hd=document.createElement("h2");hd.textContent=t;const gr=document.createElement("div");gr.className="grid";ids.forEach(i=>gr.appendChild(card(GAMES[+i-1])));el.append(hd,gr)};mk($("#rec"),"Recently played",rec);mk($("#fav"),"Favourites",favs);
const ch=$("#chips");ch.innerHTML="";[["All",-1],...CATS.map((c,i)=>[c,i]),["★ Favourites","f"]].forEach(([n,v])=>{const b=document.createElement("button");b.textContent=n;if(v==="f"?showFav:(!showFav&&v===cat))b.className="on";b.onclick=()=>{if(v==="f")showFav=!showFav;else{cat=v;showFav=false}render()};ch.appendChild(b)})}
$("#q").oninput=render;
const playable=()=>GAMES.filter(g=>IMPL[g.id]);
$("#rnd").onclick=()=>{const p=playable();launch(p[Math.random()*p.length|0].id)};
$("#dly").onclick=()=>{const d=new Date(),k=d.getFullYear()*372+d.getMonth()*31+d.getDate(),p=playable(),g=p[k%p.length];alert("Daily challenge: "+g.title+"\nBeat your best score today!");launch(g.id)};
$("#set").onclick=()=>{if(confirm("Clear ALL saved favourites, recents and high scores?")){try{Object.keys(localStorage).filter(k=>k.startsWith("99o_")).forEach(k=>localStorage.removeItem(k))}catch(e){}favs=[];rec=[];render()}};
const net=()=>{const s=$("#st");s.className=navigator.onLine?"o":"";s.lastChild.textContent=navigator.onLine?"Online (works offline too)":"Offline mode"};addEventListener("online",net);addEventListener("offline",net);net();render();
</script></body></html>
